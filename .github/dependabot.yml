version: 2
updates:
  # Aktualizuje przypięte SHA akcji w workflowach security-ci (komentarz `# vX.Y.Z` też).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # nie proponuj świeżo opublikowanych (potencjalnie złośliwych) wersji
    groups:
      actions:
        patterns: ["*"]
