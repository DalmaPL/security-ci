# Testy samego pipeline'u: zmiany w cf-workers-security.yml muszą przejść przed użyciem w repo DalmaPL.
name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pełny pipeline na czystym Workerze – musi przejść.
  clean-worker:
    uses: ./.github/workflows/cf-workers-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      working-directory: fixtures/workers/clean
      artifact-suffix: -selftest

  # Krok cf-hardening (wyciągnięty z reusable workflow) na celowo dziurawym Workerze – musi wykryć problemy.
  insecure-worker:
    name: cf-hardening detects insecure fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract wrangler check
        run: |
          yq -r '.jobs."cf-hardening".steps[] | select(.id == "wrangler-check") | .run' \
            .github/workflows/cf-workers-security.yml > "$RUNNER_TEMP/wrangler-check.sh"
          test -s "$RUNNER_TEMP/wrangler-check.sh"

      - name: Run against insecure fixture and assert findings
        env:
          TARGET: fixtures/workers/insecure
          SECURITY_CI_PLAIN: "1"
        run: |
          set +e
          bash "$RUNNER_TEMP/wrangler-check.sh" > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          fail() { echo "::error title=self-test::$1"; exit 1; }
          [ "$rc" -eq 1 ] || fail "expected exit code 1, got $rc"
          for needle in \
            "ERROR: .*wrangler.toml:[0-9]*: Plaintext secret.*vars.API_TOKEN" \
            "ERROR: .*wrangler.toml:[0-9]*: Plaintext secret.*vars.DATABASE_URL .*credentials in URL" \
            "ERROR: .*wrangler.toml:[0-9]*: Plaintext secret.*env.staging.vars.SESSION_SECRET" \
            "ERROR: .*wrangler.jsonc:[0-9]*: Plaintext secret.*vars.WEBHOOK_SIGNING_KEY" \
            "ERROR: .*wrangler.jsonc:[0-9]*: Plaintext secret.*vars.UPSTREAM.authToken" \
            "ERROR: .*\.dev\.vars:1: Local secrets file committed" \
            "WARNING: .*wrangler.toml:1: Missing compatibility_date" \
            "NOTICE: .*Suppressed.*PUBLIC_API_KEY_HEADER"
          do
            grep -Eq -- "$needle" out.txt || fail "missing finding: $needle"
          done
          for clean in ENVIRONMENT TOKEN_TTL_SECONDS AUTH_ISSUER_URL LOG_LEVEL .dev.vars.example; do
            if grep -E "^(ERROR|WARNING): .*[. ]${clean//./\\.}( |\$)" out.txt; then fail "false positive: $clean"; fi
          done
          echo "All expected findings detected."

      - name: Run from repo root - fixture skipped via .security-ci-ignore
        env:
          TARGET: "."
          SECURITY_CI_PLAIN: "1"
        run: |
          bash "$RUNNER_TEMP/wrangler-check.sh" | tee root.txt
          grep -q "NOTICE: .*Ignored directory.*fixtures/workers/insecure" root.txt
          ! grep -q "^ERROR:" root.txt

  # Reusable Nuclei workflow parsuje się i bez targetów kończy się "skipped".
  nuclei-no-targets:
    uses: ./.github/workflows/nuclei-dast.yml
    permissions: {}
    with:
      targets: ""

  # Kroki Nuclei (wyciągnięte z reusable workflow) na lokalnym, celowo dziurawym serwerze.
  nuclei-local:
    name: Nuclei detects exposed files (localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Serve vulnerable fixture on 127.0.0.1:8080
        run: |
          site="$RUNNER_TEMP/site"; mkdir -p "$site/.git"
          printf '[core]\n\trepositoryformatversion = 0\n\tbare = false\n' > "$site/.git/config"
          printf 'APP_ENV=production\nAPP_KEY=base64:not-a-real-key\nDB_PASSWORD=not-a-real-password\n' > "$site/.env"
          cd "$site" && nohup python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8080/.git/config > /dev/null

      - name: Run Nuclei steps and assert findings
        env:
          SEVERITY: medium,high,critical
          TEMPLATES: http/exposures/configs/
          TAGS: ""
          EXCLUDE_TAGS: dos,fuzz,intrusive,bruteforce,osint,token-spray
          RATE_LIMIT: "50"
          INTERACTSH: "false"
          FAIL_SEVERITY: high
        run: |
          set -euo pipefail
          wf=.github/workflows/nuclei-dast.yml
          eval "$(yq -r '.jobs.nuclei.env | to_entries | .[] | "export " + .key + "=" + .value' "$wf")"
          echo "http://127.0.0.1:8080" > "$RUNNER_TEMP/targets.txt"
          for id in install templates scan evaluate; do
            yq -r ".jobs.nuclei.steps[] | select(.id == \"$id\") | .run" "$wf" > "$RUNNER_TEMP/$id.sh"
            test -s "$RUNNER_TEMP/$id.sh"
          done
          for id in install templates scan; do bash "$RUNNER_TEMP/$id.sh"; done
          set +e; bash "$RUNNER_TEMP/evaluate.sh"; rc=$?; set -e
          fail() { echo "::error title=self-test::$1"; exit 1; }
          [ "$rc" -eq 1 ] || fail "evaluate should fail on a high finding (rc=$rc)"
          for id in git-config laravel-env; do
            jq -e --arg id "$id" 'select(."template-id" == $id)' nuclei.jsonl > /dev/null || fail "missing finding: $id"
          done
          echo "Nuclei self-test OK"
