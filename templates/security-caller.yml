# Wklej jako .github/workflows/security.yml. Uruchamiany raz w tygodniu (i ręcznie), nie przy każdym PR.
name: Security

on:
  schedule:
    - cron: "27 3 * * 1" # poniedziałek 03:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: DalmaPL/security-ci/.github/workflows/cf-workers-security.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
